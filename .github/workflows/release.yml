name: Release on tag (JDK)

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & test (Maven)
        run: mvn -B -ntp -DskipTests=false verify

  release:
    name: Build artifacts & publish release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      # ---------- Build ----------
      - name: Build (Maven)
        run: mvn -B -ntp -DskipTests package

      # ---------- Collect artifacts ----------
      - name: Prepare release files
        run: |
          mkdir -p release
          # Maven default output
          cp target/*.jar release/ || true
          cp target/*.pom release/ || true  
          # Add checksums
          (cd release && for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done)

      # ---------- Create GitHub Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
